<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#090e0b"><title>Hold'em</title><style>
:root{--bg:#090e0b;--p:#121a16;--p2:#18231e;--line:#2d4037;--txt:#eff7f2;--muted:#8ea097;--g:#56dda0;--r:#ff8c92;--gold:#efcb70;--safe:env(safe-area-inset-bottom,0px)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}body{min-height:100dvh}button,input,select{font:inherit}button{cursor:pointer}.wrap{min-height:100dvh}.center{min-height:100dvh;display:grid;place-items:center;padding:22px 16px}.home{width:min(100%,430px)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:24px}.logo{width:50px;height:50px;border-radius:15px;background:linear-gradient(135deg,#67ecad,#178255);color:#052519;display:grid;place-items:center;font-size:26px;font-weight:1000}.brand h1{margin:0;font-size:29px}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.panel{background:linear-gradient(180deg,#141e19,#0e1512);border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:0 20px 55px #0007}.stack{display:flex;flex-direction:column;gap:11px}.field label{display:block;font-size:10px;color:var(--muted);margin:0 0 6px 3px}.inp,.sel{height:50px;width:100%;border-radius:13px;border:1px solid #34483e;background:#0a100d;color:#fff;padding:0 13px;outline:none}.inp:focus,.sel:focus{border-color:var(--g)}.btn{border:0;border-radius:13px;height:50px;font-weight:900}.primary{background:var(--g);color:#062719}.secondary{background:#202d27;color:#e8f1ec;border:1px solid #37493f}.danger{background:#4d292b;color:#ffb6b9}.row{display:flex;gap:8px}.row>*{flex:1}.muted{color:var(--muted)}.tiny{font-size:11px}.hide{display:none!important}.top{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 11px;border-bottom:1px solid #ffffff0d}.top b{font-size:14px}.top small{color:var(--muted);margin-left:6px}.tools{display:flex;gap:5px}.mini{height:34px;border-radius:10px;border:1px solid #31453b;background:#17211c;color:#dbe7e0;padding:0 9px;font-size:10px;font-weight:800}.lobby{max-width:600px;margin:auto;padding:15px 11px}.code{display:flex;align-items:center;justify-content:space-between;background:#101813;border:1px solid var(--line);border-radius:15px;padding:12px 14px}.code strong{letter-spacing:3px;font-size:19px}.seats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.seatpick{min-height:74px;text-align:left;padding:10px;border-radius:14px;border:1px solid #31453a;background:#111a16;color:#dce8e1}.seatpick em{display:block;color:var(--g);font-style:normal;font-weight:900;margin-top:5px}.seatpick:disabled{opacity:.65;cursor:default}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:11px 0}.stat{background:#101713;border-radius:10px;padding:8px;text-align:center;font-size:9px;color:var(--muted)}.stat b{display:block;color:#e7f0eb;font-size:11px;margin-top:3px}.stage{padding:6px 4px 112px;background:radial-gradient(circle at 50% 25%,#10251b,#090e0b 55%);min-height:calc(100dvh - 58px)}.table{width:min(96vw,700px);height:min(61vh,570px);min-height:415px;margin:12px auto 0;border-radius:48%/42%;position:relative;background:radial-gradient(ellipse,#237a59,#14513d 60%,#0a3124);border:7px solid #202a25;box-shadow:inset 0 0 0 2px #3a4b42,0 25px 60px #0009}.table:after{content:"";position:absolute;inset:9px;border:1px solid #fff2;border-radius:inherit}.centerpot{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);z-index:3;text-align:center;width:72%}.street{display:inline-block;padding:4px 8px;border-radius:99px;background:#08271cbb;border:1px solid #fff2;color:#c7dbd0;font-size:9px;letter-spacing:1px}.board{display:flex;justify-content:center;gap:3px;margin:7px 0}.pot{font-weight:1000;font-size:15px}.recent{margin-top:5px;font-size:9px;color:#d6e9df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pseat{position:absolute;transform:translate(-50%,-50%);z-index:5;width:84px;min-height:63px;background:#101713ef;border:1px solid #35483e;border-radius:13px;padding:5px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 8px 18px #0008}.pseat.me{width:94px;border-color:#559f7b}.pseat.turn{box-shadow:0 0 0 3px #56dda033,0 8px 18px #0008;border-color:#73efb2}.pseat.fold{opacity:.45}.pseat strong{font-size:10px;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pseat span{font-size:9px;color:#aabbb2}.pseat small{font-size:8px;color:var(--gold);font-weight:900}.tag{position:absolute;top:-9px;left:3px;display:flex;gap:2px}.tag i{font-style:normal;font-size:7px;font-weight:1000;color:#172019;background:#e6eee9;border-radius:99px;padding:4px}.bet{position:absolute;bottom:-17px;background:#f4d16e;color:#30280d;border:2px solid #967923;border-radius:99px;font-style:normal;font-size:8px;font-weight:900;padding:2px 5px}.s0{left:50%;top:94%}.s1{left:8%;top:72%}.s2{left:8%;top:27%}.s3{left:50%;top:6%}.s4{left:92%;top:27%}.s5{left:92%;top:72%}.card{width:51px;height:72px;border-radius:8px;background:#f7faf8;color:#121714;border:1px solid #d9dfdc;box-shadow:0 5px 14px #0005;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:1000;line-height:1}.card.red{color:#d83b45}.card b{font-size:19px}.card i{font-style:normal;font-size:20px;margin-top:3px}.card.sm{width:35px;height:49px;border-radius:6px}.card.sm b{font-size:13px}.card.sm i{font-size:14px}.slot{width:35px;height:49px;border:1px dashed #fff3;border-radius:6px}.my{display:flex;flex-direction:column;align-items:center;margin-top:11px}.mycards{display:flex;gap:5px}.made{font-size:11px;color:#b8c8bf;margin-top:6px}.actions{position:fixed;bottom:0;left:0;right:0;z-index:30;display:grid;grid-template-columns:28fr 34fr 38fr;gap:7px;padding:11px 10px calc(11px + var(--safe));background:linear-gradient(180deg,transparent,#080d0aeF 25%,#080d0a)}.act{height:54px;border:0;border-radius:14px;font-weight:900;color:#fff}.foldbtn{background:#55282b;color:#ffb2b6}.checkbtn{background:#26332d}.raisebtn{background:#49d394;color:#082519}.wait{position:fixed;bottom:0;left:0;right:0;padding:18px 10px calc(18px + var(--safe));background:#090e0df2;color:#83938b;text-align:center;font-size:11px;z-index:25}.overlay{position:fixed;inset:0;background:#000b;z-index:70;display:grid;place-items:end center}.sheet{width:min(100%,560px);max-height:82dvh;overflow:auto;background:#151e1a;border:1px solid #34473d;border-radius:21px 21px 0 0;padding:17px 15px calc(17px + var(--safe))}.sheet h3{margin:0 0 14px}.sheettop{display:flex;justify-content:space-between;align-items:center}.x{border:0;background:#26332d;color:#fff;border-radius:10px;width:34px;height:34px}.rank{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #293a32;padding:9px 0;font-size:12px}.cardsm{display:flex;gap:2px}.toast{position:fixed;z-index:100;left:50%;bottom:95px;transform:translateX(-50%);background:#29352f;border:1px solid #46594f;border-radius:99px;padding:9px 14px;font-size:11px;box-shadow:0 8px 30px #0008}.result{max-width:560px;margin:12px auto;padding:0 11px}.resultbox{background:#111a16;border:1px solid var(--line);border-radius:15px;padding:13px}.winner{display:flex;justify-content:space-between;border-top:1px solid #293930;padding:8px 0}.winner b{color:var(--g)}@media(max-width:360px){.pseat{width:74px}.pseat.me{width:82px}.table{min-height:390px}.card{width:47px;height:67px}}
</style></head><body><div id="app" class="wrap"></div><div id="modal"></div><div id="toast"></div><script>
const API='https://vxrsgcsxquaunvxnlkcv.supabase.co/functions/v1/holdem-api';
const app=document.getElementById('app'),modal=document.getElementById('modal'),toastBox=document.getElementById('toast');let token=localStorage.getItem('holdem_token')||'',state=null,poll=null,busy=false,autoKey='';
const fmt=n=>Number(n||0).toLocaleString('ko-KR'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function code(){return new URLSearchParams(location.search).get('room')?.toUpperCase()||''}function route(c){history.pushState({},'',`?room=${c}`);load(false)}function setToken(v){token=v||'';localStorage.setItem('holdem_token',token)}
function toast(s){toastBox.innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>toastBox.innerHTML='',2200)}function close(){modal.innerHTML=''}
async function api(body,use=true){const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json',...(use&&token?{'x-holdem-session':token}:{})},body:JSON.stringify(body)});const j=await r.json().catch(()=>({ok:false,message:'서버 응답 오류'}));if(!r.ok||!j.ok)throw new Error(j.message||j.code||'요청 실패');return j}
function suit(c){return({S:'♠',H:'♥',D:'♦',C:'♣'}[c?.slice(-1)]||'')}function card(c,sm=false){if(!c)return `<span class="slot"></span>`;const r=c.slice(0,-1),s=suit(c),red=/[HD]$/.test(c);return `<span class="card ${red?'red':''} ${sm?'sm':''}"><b>${r}</b><i>${s}</i></span>`}
function home(){clearInterval(poll);app.innerHTML=`<main class="center"><section class="home"><div class="brand"><div class="logo">H</div><div><h1>Hold'em</h1><p>친구들과 즐기는 무료 플레이머니 홀덤</p></div></div><div class="panel stack"><div class="field"><label>닉네임</label><input class="inp" id="nick" maxlength="20" value="${esc(localStorage.getItem('holdem_name')||'')}" placeholder="닉네임"></div><button class="btn primary" id="create">방 만들기</button><div class="field"><label>방 코드</label><input class="inp" id="joincode" maxlength="6" placeholder="예: A7KD92"></div><button class="btn secondary" id="join">방 참가하기</button></div></section></main>`;document.getElementById('create').onclick=createSheet;document.getElementById('join').onclick=()=>{const n=document.getElementById('nick').value.trim(),c=document.getElementById('joincode').value.trim().toUpperCase();if(!n)return toast('닉네임을 입력해주세요.');if(c.length!==6)return toast('6자리 방 코드를 입력해주세요.');localStorage.setItem('holdem_name',n);route(c)}}
function createSheet(){const n=document.getElementById('nick').value.trim();if(!n)return toast('닉네임을 입력해주세요.');modal.innerHTML=`<div class="overlay"><section class="sheet"><div class="sheettop"><h3>방 만들기</h3><button class="x" id="cx">×</button></div><div class="stack"><div class="field"><label>방 이름</label><input id="rn" class="inp" value="친구 홀덤"></div><div class="row"><div class="field"><label>시작 칩</label><input id="stack" class="inp" type="number" value="10000"></div><div class="field"><label>최대 인원</label><select id="max" class="sel"><option>2</option><option>3</option><option>4</option><option>5</option><option selected>6</option></select></div></div><div class="row"><div class="field"><label>SB</label><input id="sb" class="inp" type="number" value="50"></div><div class="field"><label>BB</label><input id="bb" class="inp" type="number" value="100"></div></div><div class="field"><label>액션 제한시간</label><select id="timer" class="sel"><option value="15">15초</option><option value="30" selected>30초</option><option value="45">45초</option><option value="">제한 없음</option></select></div><button class="btn primary" id="make">방 만들기</button></div></section></div>`;document.getElementById('cx').onclick=close;document.getElementById('make').onclick=async()=>{if(busy)return;busy=true;try{const j=await api({op:'createRoom',displayName:n,roomName:document.getElementById('rn').value,maxPlayers:+document.getElementById('max').value,startingStack:+document.getElementById('stack').value,smallBlind:+document.getElementById('sb').value,bigBlind:+document.getElementById('bb').value,actionTimerSeconds:document.getElementById('timer').value?+document.getElementById('timer').value:null},false);localStorage.setItem('holdem_name',n);setToken(j.token);close();route(j.code)}catch(e){toast(e.message)}finally{busy=false}}}
async function load(silent=true){const c=code();if(!c)return home();try{if(!token)throw new Error('JOIN');const j=await api({op:'state',code:c});state=j.state;render()}catch(e){if(e.message==='JOIN'||/SESSION|ROOM_NOT_FOUND/.test(e.message))joinView(c);else if(!silent)toast(e.message)}}
function joinView(c){clearInterval(poll);app.innerHTML=`<main class="center"><section class="home"><div class="brand"><div class="logo">H</div><div><h1>방 #${esc(c)}</h1><p>닉네임을 입력하고 참가하세요</p></div></div><div class="panel stack"><div class="field"><label>닉네임</label><input id="jn" class="inp" maxlength="20" value="${esc(localStorage.getItem('holdem_name')||'')}"></div><button class="btn primary" id="enter">입장</button><button class="btn secondary" id="back">처음으로</button></div></section></main>`;document.getElementById('back').onclick=()=>{history.pushState({},'',location.pathname);home()};document.getElementById('enter').onclick=async()=>{const n=document.getElementById('jn').value.trim();if(!n)return toast('닉네임을 입력해주세요.');try{const j=await api({op:'joinRoom',code:c,displayName:n},false);setToken(j.token);localStorage.setItem('holdem_name',n);load(false)}catch(e){toast(e.message)}}}
function header(){return `<header class="top"><div><b>${esc(state.room.name)}</b><small>#${state.room.code}</small></div><div class="tools"><button class="mini" id="share">공유</button><button class="mini" id="ranks">족보</button><button class="mini" id="menu">메뉴</button></div></header>`}
function render(){clearInterval(poll);poll=setInterval(()=>load(true),1100);app.innerHTML=header()+(state.hand&&state.hand.street!=='HAND_COMPLETE'?table():lobby())+(state.hand?.street==='HAND_COMPLETE'?results():'');wire();if(state.hand?.street==='HAND_COMPLETE'&&state.room.isHost&&state.room.settings.autoNextHand&&autoKey!==state.hand.id){autoKey=state.hand.id;setTimeout(()=>cmd({op:'start',code:state.room.code},true),4500)}}
function lobby(){const seated=state.players.filter(p=>p.seatNo);return `<main class="lobby"><div class="code"><div><span class="tiny muted">방 코드</span><br><strong>${state.room.code}</strong></div><button class="mini" id="copy">복사</button></div><div class="seats">${Array.from({length:state.room.maxPlayers},(_,i)=>{const no=i+1,p=state.players.find(x=>x.seatNo===no);return `<button class="seatpick" data-seat="${no}" ${p?'disabled':''}>Seat ${no}<em>${p?esc(p.displayName):'빈 자리'}</em></button>`}).join('')}</div><div class="stats"><div class="stat">시작 칩<b>${fmt(state.room.settings.startingStack)}</b></div><div class="stat">Blind<b>${fmt(state.room.settings.smallBlind)} / ${fmt(state.room.settings.bigBlind)}</b></div><div class="stat">Timer<b>${state.room.settings.actionTimerSeconds?state.room.settings.actionTimerSeconds+'초':'없음'}</b></div></div>${state.room.isHost?`<button id="start" class="btn primary" style="width:100%" ${seated.length<2?'disabled':''}>게임 시작</button>`:`<div class="panel tiny muted" style="text-align:center">방장이 게임을 시작할 때까지 기다려주세요.</div>`}</main>`}
function positions(){const me=state.players.find(p=>p.playerId===state.me?.playerId),base=me?.seatNo||1;return state.players.filter(p=>p.seatNo).map(p=>({...p,pos:(p.seatNo-base+6)%6}))}
function table(){const h=state.hand,a=state.private?.allowedActions,rec=state.recentActions.at(-1),recp=state.players.find(p=>p.playerId===rec?.playerId);return `<main class="stage"><div class="table"><div class="centerpot"><span class="street">${h.street}</span><div class="board">${[0,1,2,3,4].map(i=>state.board[i]?card(state.board[i],true):'<span class="slot"></span>').join('')}</div><div class="pot">Pot ${fmt(h.potTotal)}</div><div class="recent">${rec?`${esc(recp?.displayName||'')} · ${rec.type}${rec.raiseTo?' '+fmt(rec.raiseTo):rec.amount?' '+fmt(rec.amount):''}`:''}</div></div>${positions().map(p=>pseat(p,h)).join('')}</div><div class="my"><div class="mycards">${state.private?.holeCards?.map(c=>card(c)).join('')||''}</div><div class="made">${esc(state.private?.currentMadeHand||'')}</div></div></main>${actions(a)}`}
function pseat(p,h){const tags=[h.dealerSeat===p.seatNo?'D':'',h.sbSeat===p.seatNo?'SB':'',h.bbSeat===p.seatNo?'BB':''].filter(Boolean),me=p.playerId===state.me?.playerId,turn=h.currentActorPlayerId===p.playerId;return `<div class="pseat s${p.pos} ${me?'me':''} ${turn?'turn':''} ${p.folded?'fold':''}"><div class="tag">${tags.map(t=>`<i>${t}</i>`).join('')}</div><strong>${esc(p.displayName)}</strong><span>${fmt(p.stack)}</span>${p.allIn?'<small>ALL-IN</small>':p.folded?'<small>FOLD</small>':p.status==='SIT_OUT'?'<small>SIT OUT</small>':''}${p.streetBet?`<i class="bet">${fmt(p.streetBet)}</i>`:''}</div>`}
function actions(a){if(!a)return `<div class="wait">게임 상태를 불러오는 중…</div>`;const mid=a.check?'체크':a.call?`콜 ${fmt(a.callAmount)}`:'체크',third=a.bet?'베팅':a.raise?'레이즈':a.allIn?'올인':'베팅';return `<div class="actions"><button id="fold" class="act foldbtn" ${a.fold?'':'disabled'}>폴드</button><button id="mid" class="act checkbtn" ${(a.check||a.call)?'':'disabled'}>${mid}</button><button id="raise" class="act raisebtn" ${(a.bet||a.raise||a.allIn)?'':'disabled'}>${third}</button></div>`}
function results(){const winners=(state.results||[]).filter(x=>x.payout>0);return `<section class="result"><div class="resultbox"><b>Hand #${state.hand.handNo} 결과</b>${winners.map(r=>{const p=state.players.find(x=>x.playerId===r.playerId);return `<div class="winner"><span>${esc(p?.displayName||'Player')} · ${esc(r.category)}</span><b>+${fmt(r.payout)}</b></div>`}).join('')||'<p class="muted tiny">Hand 완료</p>'}</div></section>`}
function wire(){document.getElementById('share').onclick=share;document.getElementById('ranks').onclick=ranks;document.getElementById('menu').onclick=menu;document.getElementById('copy')?.addEventListener('click',()=>copy(state.room.code));document.querySelectorAll('[data-seat]').forEach(b=>b.onclick=()=>cmd({op:'seat',code:state.room.code,seatNo:+b.dataset.seat}));document.getElementById('start')?.addEventListener('click',()=>cmd({op:'start',code:state.room.code}));const a=state.private?.allowedActions;document.getElementById('fold')?.addEventListener('click',()=>act('FOLD'));document.getElementById('mid')?.addEventListener('click',()=>act(a.check?'CHECK':'CALL'));document.getElementById('raise')?.addEventListener('click',()=>{if(a.bet||a.raise)raiseSheet(a);else act('ALL_IN')})}
async function cmd(body,silent=false){if(busy)return;busy=true;try{await api(body);await load(true)}catch(e){if(!silent)toast(e.message)}finally{busy=false}}
async function act(type,raiseTo){if(!state.hand||busy)return;busy=true;close();try{await api({op:'action',handId:state.hand.id,actionId:crypto.randomUUID(),expectedVersion:state.hand.version,type,...(raiseTo!=null?{raiseTo}:{})});await load(true)}catch(e){toast(e.message);await load(true)}finally{busy=false}}
function raiseSheet(a){const min=Number(a.minRaiseTo??a.minBet??1),max=Number(a.maxRaiseTo||min);modal.innerHTML=`<div class="overlay"><section class="sheet"><div class="sheettop"><h3>${a.bet?'베팅':'레이즈'}</h3><button id="rx" class="x">×</button></div><div class="stats"><div class="stat">Call<b>${fmt(a.callAmount)}</b></div><div class="stat">Min<b>${fmt(min)}</b></div><div class="stat">Max<b>${fmt(max)}</b></div></div><input id="rv" class="inp" type="number" min="${min}" max="${max}" value="${min}"><div class="row" style="margin-top:10px"><button class="btn secondary" id="allin">All-In</button><button class="btn primary" id="rgo">확인</button></div></section></div>`;document.getElementById('rx').onclick=close;document.getElementById('allin').onclick=()=>act('ALL_IN');document.getElementById('rgo').onclick=()=>{let v=Math.max(min,Math.min(max,+document.getElementById('rv').value||min));act(a.bet?'BET':'RAISE',v)}}
function ranks(){const rows=['로열 플러시','스트레이트 플러시','포카드','풀하우스','플러시','스트레이트','트리플','투페어','원페어','하이카드'];modal.innerHTML=`<div class="overlay"><section class="sheet"><div class="sheettop"><h3>홀덤 족보</h3><button id="qx" class="x">×</button></div>${rows.map((x,i)=>`<div class="rank"><b>${i+1}. ${x}</b></div>`).join('')}</section></div>`;document.getElementById('qx').onclick=close}
function menu(){const me=state.players.find(p=>p.playerId===state.me?.playerId);modal.innerHTML=`<div class="overlay"><section class="sheet"><div class="sheettop"><h3>메뉴</h3><button id="mx" class="x">×</button></div><div class="stack"><button class="btn secondary" id="sit">${me?.status==='SIT_OUT'?'게임 복귀':'자리 비움'}</button>${state.room.isHost?`<button class="btn secondary" id="pause">${state.room.status==='PAUSED'?'게임 재개':'게임 일시정지'}</button>`:''}<button class="btn danger" id="leave">게임 나가기</button></div></section></div>`;document.getElementById('mx').onclick=close;document.getElementById('sit').onclick=()=>{close();cmd({op:'sitOut',code:state.room.code,sitOut:me?.status!=='SIT_OUT'})};document.getElementById('pause')?.addEventListener('click',()=>{close();cmd({op:'pause',code:state.room.code,paused:state.room.status!=='PAUSED'})});document.getElementById('leave').onclick=async()=>{if(!confirm('게임에서 나갈까요?'))return;try{await api({op:'leave',code:state.room.code});setToken('');history.pushState({},'',location.pathname);close();home()}catch(e){toast(e.message)}}}
function share(){const u=`${location.origin}${location.pathname}?room=${state.room.code}`;if(navigator.share)navigator.share({title:"Hold'em",text:`홀덤 방 #${state.room.code}`,url:u}).catch(()=>{});else copy(u)}async function copy(s){try{await navigator.clipboard.writeText(s);toast('복사했습니다.')}catch{toast(s)}}
window.addEventListener('popstate',()=>load(false));load(false);
</script></body></html>
