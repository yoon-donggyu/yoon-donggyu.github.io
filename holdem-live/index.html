<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090d0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hold'em</title>
  <link rel="stylesheet" href="./style.css?v=20260916-2">
  <link rel="stylesheet" href="./enhance.css?v=20260916-3">
  <link rel="stylesheet" href="./luxury.css?v=20260916-5">
  <style>
    /* Lobby/home polish: dark wood casino lounge + glassmorphism */
    .center{position:relative;overflow:hidden;background:
      radial-gradient(circle at 20% 20%,rgba(188,126,66,.17),transparent 24%),
      radial-gradient(circle at 78% 16%,rgba(224,180,104,.09),transparent 18%),
      linear-gradient(135deg,rgba(12,8,6,.96),rgba(7,10,8,.97) 48%,rgba(10,7,5,.98))}
    .center:before{content:"";position:absolute;inset:0;pointer-events:none;background:
      linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
      linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
      radial-gradient(ellipse at 50% 120%,rgba(24,88,61,.18),transparent 52%);background-size:54px 54px,54px 54px,auto}
    .home{position:relative;z-index:1}.brand{justify-content:center;text-align:left}.brand-mark{background:linear-gradient(145deg,#ece7dc,#9f9a91 42%,#fff 58%,#77736d)!important;color:#181713!important;border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px rgba(255,255,255,.75),0 10px 30px rgba(0,0,0,.4)!important;text-shadow:0 1px rgba(255,255,255,.45)}
    .brand h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:.2px}.brand p{color:#aa9f91!important}
    .home>.card,.lobby .code-box,.lobby .seat-choice{background:linear-gradient(145deg,rgba(29,28,25,.78),rgba(8,11,9,.86))!important;border:1px solid rgba(226,196,135,.18)!important;backdrop-filter:blur(18px);box-shadow:0 18px 55px rgba(0,0,0,.46),inset 0 1px rgba(255,255,255,.04)!important}
    .input,.select{background:rgba(4,8,6,.72)!important;border-color:rgba(218,195,148,.19)!important;box-shadow:inset 0 1px 8px rgba(0,0,0,.28)}
    .input:focus,.select:focus{border-color:rgba(89,224,157,.72)!important;box-shadow:0 0 0 3px rgba(89,224,157,.10),inset 0 1px 8px rgba(0,0,0,.25)!important}
    .btn.primary{background:linear-gradient(180deg,#5de0a0,#2ba66f)!important;border:1px solid rgba(158,255,205,.22);box-shadow:inset 0 1px rgba(255,255,255,.20),0 8px 24px rgba(28,139,91,.18)}
    .btn.secondary{background:linear-gradient(180deg,rgba(66,70,67,.76),rgba(28,31,29,.90))!important;border-color:rgba(218,201,171,.15)!important}
    .lobby{position:relative}.lobby:before{content:"POKER LOUNGE";display:block;text-align:center;font:700 11px/1 Georgia,serif;letter-spacing:4px;color:rgba(224,200,151,.32);margin:3px 0 14px}
    .code-box b{color:#f4dfb0}.seat-grid{gap:10px}.seat-choice{position:relative;overflow:hidden;transition:transform .12s ease,border-color .12s ease,filter .12s ease}.seat-choice:not(:disabled){border-color:rgba(80,216,148,.26)!important}.seat-choice:not(:disabled):active{transform:scale(.985);filter:brightness(1.08)}.seat-choice:not(:disabled):after{content:"TAP TO SIT";position:absolute;right:8px;bottom:7px;font-size:7px;letter-spacing:1px;color:rgba(102,229,164,.60)}
    .seat-choice.occupied{background:linear-gradient(145deg,rgba(25,26,24,.82),rgba(12,14,13,.90))!important}.seat-choice.occupied:after{display:none}.seat-choice b{color:#68e0a6!important}.seat-choice.occupied b{color:#c8c2b8!important}
    .lobby-settings span{background:rgba(10,14,12,.66)!important;border:1px solid rgba(221,195,143,.09)}

    /* Landscape-first gameplay */
    .rotate-hint{display:none;position:fixed;inset:0;z-index:999;background:radial-gradient(circle at 50% 38%,rgba(24,73,52,.35),rgba(3,5,4,.97) 56%);align-items:center;justify-content:center;padding:24px;text-align:center}
    .rotate-card{max-width:320px;padding:22px 20px;border-radius:20px;background:linear-gradient(145deg,rgba(31,30,27,.90),rgba(9,12,10,.96));border:1px solid rgba(231,202,145,.20);box-shadow:0 24px 70px rgba(0,0,0,.55)}
    .rotate-icon{font-size:42px;line-height:1;margin-bottom:10px}.rotate-card b{display:block;font-size:18px;margin-bottom:6px}.rotate-card span{display:block;color:#a9b1ac;font-size:12px;line-height:1.5}
    @media (orientation:landscape) and (max-height:560px){
      .game-header{height:46px!important;padding:0 10px!important}.game-header strong{font-size:12px!important}.icon-btn{height:30px!important;font-size:9px!important}
      .room-shell{min-height:100dvh!important;padding-bottom:0!important}.stage{padding:4px 172px 64px 12px!important;min-height:calc(100dvh - 46px)!important}
      .poker-table{width:min(74vw,860px)!important;height:calc(100dvh - 72px)!important;min-height:300px!important;max-height:none!important;margin:6px auto 0!important;border-radius:48%/43%!important}
      .table-center{top:48%!important;width:62%!important}.community{gap:5px!important}.card-ui.small,.slot{width:42px!important;height:59px!important}.card-ui.small b{font-size:15px!important}.card-ui.small em{font-size:17px!important}
      .seat{width:92px!important;min-height:59px!important}.seat.me{width:102px!important}.seat .avatar{width:22px!important;height:22px!important}.seat strong{font-size:9px!important}.seat span{font-size:9px!important}
      .pos0{left:50%!important;top:91%!important}.pos1{left:14%!important;top:78%!important}.pos2{left:13%!important;top:22%!important}.pos3{left:50%!important;top:8%!important}.pos4{left:87%!important;top:22%!important}.pos5{left:86%!important;top:78%!important}
      .my-panel{position:fixed!important;left:50%!important;bottom:7px!important;transform:translateX(-50%)!important;z-index:34!important;margin:0!important;flex-direction:row!important;gap:9px!important;align-items:flex-end!important}.my-cards .card-ui{width:52px!important;height:72px!important}.made{margin:0 0 5px 2px!important;max-width:145px!important;white-space:nowrap!important}
      .player-hud{position:fixed!important;right:9px!important;top:52px!important;width:154px!important;display:flex!important;flex-direction:column!important;gap:6px!important}.hud-box{min-height:0!important;padding:8px 10px!important}.hud-box.chips b,.hud-box.profit b{font-size:21px!important}.hud-box.hand b{font-size:15px!important}
      .actionbar{left:auto!important;right:8px!important;bottom:8px!important;width:340px!important;transform:none!important;grid-template-columns:90px 110px 124px!important;padding:7px!important;border:1px solid rgba(230,204,154,.12)!important;border-radius:15px!important;background:rgba(8,11,9,.82)!important;backdrop-filter:blur(16px)!important}.action{height:46px!important;font-size:13px!important}
      .waitbar{left:auto!important;right:8px!important;bottom:8px!important;width:340px!important;transform:none!important;padding:15px!important;border-radius:14px!important;background:rgba(8,11,9,.82)!important;border:1px solid rgba(230,204,154,.10)!important}
      .table-logo{top:69%!important}.pot{padding-top:31px!important}.pot:before{transform:translateX(-50%) scale(.88)!important}.recent{max-width:260px!important}
      .results{position:fixed!important;left:10px!important;bottom:8px!important;width:240px!important;margin:0!important;padding:0!important;z-index:35!important}.result-card{background:rgba(9,13,11,.88)!important;backdrop-filter:blur(14px)!important}
    }
    @media (orientation:landscape) and (min-height:561px){
      .stage{padding-right:178px!important}.poker-table{width:min(76vw,900px)!important;max-width:none!important}.player-hud{width:164px!important;right:12px!important}.actionbar,.waitbar{max-width:620px!important}
    }
    @media (orientation:landscape) and (min-width:900px){
      .home{width:min(900px,88vw)!important}.home>.card{display:grid!important;grid-template-columns:1fr 1fr!important;gap:12px 18px!important;align-items:end!important}.home>.card .divider{grid-column:1/-1!important}.home>.card #createBtn,.home>.card #joinBtn{align-self:end!important}.brand{justify-content:flex-start!important}
      .lobby{max-width:980px!important}.seat-grid{grid-template-columns:repeat(3,1fr)!important}
    }
    @media (orientation:portrait) and (max-width:760px){body.game-active .rotate-hint{display:flex}}
    @media(max-width:520px){.center{padding:18px 14px}.home>.card{border-radius:18px}.brand{margin-bottom:20px}.lobby{padding-top:12px}.seat-choice{min-height:82px}}
  </style>
</head>
<body>
  <div id="net" class="net-banner hidden">연결을 복구하고 있습니다…</div>
  <div id="toast" class="toast hidden"></div>
  <div id="rotateHint" class="rotate-hint"><div class="rotate-card"><div class="rotate-icon">↻</div><b>가로 화면으로 돌려주세요</b><span>게임 테이블은 Landscape 모드에서 가장 넓고 보기 좋게 표시됩니다.</span></div></div>
  <div id="app" class="app"></div>
  <div id="modal"></div>
  <script src="./app-a.js?v=20260916-2"></script>
  <script src="./app-b.js?v=20260916-2"></script>
  <script src="./app-c.js?v=20260916-3"></script>
  <script src="./app-d.js?v=20260916-5"></script>
  <script>
    /* Inline seating hotfix: prevents 1s polling re-render from swallowing mobile taps. */
    let seatPending=false;
    wireLobby=function(member){
      const copy=document.getElementById('copyCode');
      if(copy) copy.onclick=()=>copyText(state.room.code);
      document.querySelectorAll('.seat-choice[data-seat]').forEach(btn=>{
        if(btn.disabled)return;
        btn.style.touchAction='manipulation';
        const seatNo=Number(btn.dataset.seat);
        const takeSeat=async ev=>{
          ev?.preventDefault?.(); ev?.stopPropagation?.();
          if(seatPending||busy||!Number.isInteger(seatNo))return;
          seatPending=true; busy=true; stopPoll(); btn.disabled=true;
          const label=btn.querySelector('b'), old=label?.textContent||'앉기';
          if(label)label.textContent='앉는 중…';
          try{
            await api({op:'seat',code:state.room.code,seatNo});
            showToast(`Seat ${seatNo} 착석 완료`);
            await loadRoom(true);
          }catch(e){
            if(label)label.textContent=old; btn.disabled=false;
            showToast(`착석 실패 · ${e.message||'다시 시도해주세요.'}`);
            await loadRoom(true);
          }finally{busy=false;seatPending=false;startPoll()}
        };
        btn.addEventListener('pointerup',takeSeat,{passive:false});
        btn.addEventListener('click',ev=>{if(ev.detail===0)takeSeat(ev)});
      });
      const start=document.getElementById('startHand');
      if(start)start.onclick=()=>command({op:'start',code:state.room.code});
    };

    /* Show rotate guidance only while actually seated at a live table. */
    const landscapeBaseRenderRoom=renderRoom;
    renderRoom=function(){
      landscapeBaseRenderRoom();
      const me=state?.players?.find(p=>p.playerId===state?.me?.playerId);
      document.body.classList.toggle('game-active',Boolean(me?.seatNo&&state?.hand));
    };
    window.addEventListener('orientationchange',()=>setTimeout(()=>{if(state)renderRoom()},120));
    window.addEventListener('resize',()=>{if(state&&document.body.classList.contains('game-active'))document.body.classList.toggle('landscape-now',innerWidth>innerHeight)});
  </script>
</body>
</html>
