<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#090d0b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Hold'em</title>
  <link rel="stylesheet" href="./style.css?v=20260916-2">
  <link rel="stylesheet" href="./enhance.css?v=20260916-3">
  <link rel="stylesheet" href="./luxury.css?v=20260916-5">
  <style>
    /* Lobby/home polish: dark wood casino lounge + glassmorphism */
    .center{position:relative;overflow:hidden;background:
      radial-gradient(circle at 20% 20%,rgba(188,126,66,.17),transparent 24%),
      radial-gradient(circle at 78% 16%,rgba(224,180,104,.09),transparent 18%),
      linear-gradient(135deg,rgba(12,8,6,.96),rgba(7,10,8,.97) 48%,rgba(10,7,5,.98))}
    .center:before{content:"";position:absolute;inset:0;pointer-events:none;background:
      linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),
      linear-gradient(rgba(255,255,255,.012) 1px,transparent 1px),
      radial-gradient(ellipse at 50% 120%,rgba(24,88,61,.18),transparent 52%);background-size:54px 54px,54px 54px,auto}
    .home{position:relative;z-index:1}.brand{justify-content:center;text-align:left}.brand-mark{background:linear-gradient(145deg,#ece7dc,#9f9a91 42%,#fff 58%,#77736d)!important;color:#181713!important;border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1px rgba(255,255,255,.75),0 10px 30px rgba(0,0,0,.4)!important;text-shadow:0 1px rgba(255,255,255,.45)}
    .brand h1{font-family:Georgia,"Times New Roman",serif;letter-spacing:.2px}.brand p{color:#aa9f91!important}
    .home>.card,.lobby .code-box,.lobby .seat-choice{background:linear-gradient(145deg,rgba(29,28,25,.78),rgba(8,11,9,.86))!important;border:1px solid rgba(226,196,135,.18)!important;backdrop-filter:blur(18px);box-shadow:0 18px 55px rgba(0,0,0,.46),inset 0 1px rgba(255,255,255,.04)!important}
    .input,.select{background:rgba(4,8,6,.72)!important;border-color:rgba(218,195,148,.19)!important;box-shadow:inset 0 1px 8px rgba(0,0,0,.28)}
    .input:focus,.select:focus{border-color:rgba(89,224,157,.72)!important;box-shadow:0 0 0 3px rgba(89,224,157,.10),inset 0 1px 8px rgba(0,0,0,.25)!important}
    .btn.primary{background:linear-gradient(180deg,#5de0a0,#2ba66f)!important;border:1px solid rgba(158,255,205,.22);box-shadow:inset 0 1px rgba(255,255,255,.20),0 8px 24px rgba(28,139,91,.18)}
    .btn.secondary{background:linear-gradient(180deg,rgba(66,70,67,.76),rgba(28,31,29,.90))!important;border-color:rgba(218,201,171,.15)!important}
    .lobby{position:relative}.lobby:before{content:"POKER LOUNGE";display:block;text-align:center;font:700 11px/1 Georgia,serif;letter-spacing:4px;color:rgba(224,200,151,.32);margin:3px 0 14px}
    .code-box b{color:#f4dfb0}.seat-grid{gap:10px}.seat-choice{position:relative;overflow:hidden;transition:transform .12s ease,border-color .12s ease,filter .12s ease}.seat-choice:not(:disabled){border-color:rgba(80,216,148,.26)!important}.seat-choice:not(:disabled):active{transform:scale(.985);filter:brightness(1.08)}.seat-choice:not(:disabled):after{content:"TAP TO SIT";position:absolute;right:8px;bottom:7px;font-size:7px;letter-spacing:1px;color:rgba(102,229,164,.60)}
    .seat-choice.occupied{background:linear-gradient(145deg,rgba(25,26,24,.82),rgba(12,14,13,.90))!important}.seat-choice.occupied:after{display:none}.seat-choice b{color:#68e0a6!important}.seat-choice.occupied b{color:#c8c2b8!important}
    .lobby-settings span{background:rgba(10,14,12,.66)!important;border:1px solid rgba(221,195,143,.09)}
    @media(max-width:520px){.center{padding:18px 14px}.home>.card{border-radius:18px}.brand{margin-bottom:20px}.lobby{padding-top:12px}.seat-choice{min-height:82px}}
  </style>
</head>
<body>
  <div id="net" class="net-banner hidden">연결을 복구하고 있습니다…</div>
  <div id="toast" class="toast hidden"></div>
  <div id="app" class="app"></div>
  <div id="modal"></div>
  <script src="./app-a.js?v=20260916-2"></script>
  <script src="./app-b.js?v=20260916-2"></script>
  <script src="./app-c.js?v=20260916-3"></script>
  <script src="./app-d.js?v=20260916-5"></script>
  <script>
    /* Inline seating hotfix: prevents 1s polling re-render from swallowing mobile taps. */
    let seatPending=false;
    wireLobby=function(member){
      const copy=document.getElementById('copyCode');
      if(copy) copy.onclick=()=>copyText(state.room.code);
      document.querySelectorAll('.seat-choice[data-seat]').forEach(btn=>{
        if(btn.disabled)return;
        btn.style.touchAction='manipulation';
        const seatNo=Number(btn.dataset.seat);
        const takeSeat=async ev=>{
          ev?.preventDefault?.(); ev?.stopPropagation?.();
          if(seatPending||busy||!Number.isInteger(seatNo))return;
          seatPending=true; busy=true; stopPoll(); btn.disabled=true;
          const label=btn.querySelector('b'), old=label?.textContent||'앉기';
          if(label)label.textContent='앉는 중…';
          try{
            await api({op:'seat',code:state.room.code,seatNo});
            showToast(`Seat ${seatNo} 착석 완료`);
            await loadRoom(true);
          }catch(e){
            if(label)label.textContent=old; btn.disabled=false;
            showToast(`착석 실패 · ${e.message||'다시 시도해주세요.'}`);
            await loadRoom(true);
          }finally{busy=false;seatPending=false;startPoll()}
        };
        btn.addEventListener('pointerup',takeSeat,{passive:false});
        btn.addEventListener('click',ev=>{if(ev.detail===0)takeSeat(ev)});
      });
      const start=document.getElementById('startHand');
      if(start)start.onclick=()=>command({op:'start',code:state.room.code});
    };
  </script>
</body>
</html>
