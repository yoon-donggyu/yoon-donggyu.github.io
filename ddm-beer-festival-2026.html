<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFC84B">
<title>2026 동대문구 맥주축제 가이드</title>
<style>
body{margin:0;background:#FFF8E7;color:#082757;font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif}.loading{max-width:520px;margin:20vh auto;padding:24px;text-align:center;font-weight:850}.loading small{display:block;margin-top:8px;color:#667085;font-weight:650}
</style>
</head>
<body>
<div class="loading">🍺 축제 가이드를 불러오는 중입니다.<small>잠시만 기다려 주세요.</small></div>
<script>
(async()=>{
 try{
  const r=await fetch('./ddm-beer-festival-2026-base.html?v=20260828-4',{cache:'no-store'});
  if(!r.ok) throw new Error('base '+r.status);
  const text=await r.text();
  const doc=new DOMParser().parseFromString(text,'text/html');

  const style=doc.createElement('style');
  style.textContent=`
  .map-card{background:#fff;border:1px solid #E7D89F;border-radius:18px;padding:10px;box-shadow:0 8px 24px rgba(8,39,87,.04)}
  .map-card a{display:block;text-decoration:none}.map-card img{display:block;width:100%;height:auto;border-radius:12px;background:#f4f4f4}
  .map-caption{font-size:11.5px;color:#667085;padding:9px 4px 2px}.map-caption b{color:#082757}
  .check-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.check-progress{font-size:11px;font-weight:900;background:#082757;color:#fff;padding:6px 9px;border-radius:999px;white-space:nowrap}
  .check-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check-item{display:flex;align-items:flex-start;gap:9px;background:#fff;border:1px solid #E7D89F;border-radius:14px;padding:11px;cursor:pointer;transition:.15s}.check-item.checked{background:#E6F5E9;border-color:#B8DCC0}.check-item input{width:19px;height:19px;margin:1px 0 0;accent-color:#082757;flex:0 0 auto}.check-item b{display:block;font-size:12.5px}.check-item small{display:block;font-size:10.5px;color:#667085;margin-top:2px;line-height:1.35}.reset-pack{border:0;background:transparent;color:#667085;text-decoration:underline;font-size:11px;padding:6px;cursor:pointer}.mini-pack{margin-top:10px;background:#FFF2BD;border:1px solid #E0C76A;border-radius:14px;padding:11px 12px;font-size:12px}.ref-note{font-size:10.8px;color:#667085;margin-top:9px;line-height:1.45}.ref-note a{color:#0B4D94;word-break:break-all}
  @media(max-width:520px){.check-grid{grid-template-columns:1fr}.map-card{padding:7px}}
  `;
  doc.head.appendChild(style);

  const nav=doc.querySelector('.nav');
  if(nav){
   const mapA=doc.createElement('a');mapA.href='#map2026';mapA.textContent='배치도';
   const packA=doc.createElement('a');packA.href='#packing';packA.textContent='준비물';
   const zonesA=[...nav.querySelectorAll('a')].find(a=>a.getAttribute('href')==='#zones');
   if(zonesA){zonesA.after(mapA);mapA.after(packA)}else{nav.append(mapA,packA)}
  }

  const map=doc.createElement('section');
  map.className='section';map.id='map2026';
  map.innerHTML=`<h2>🗺️ 2026 축제장 배치도</h2><p class="lead">보내주신 배치도입니다. 이미지를 누르면 크게 볼 수 있습니다.</p><div class="map-card"><a href="./ddm-beer-festival-map.webp?v=20260828" target="_blank" rel="noopener"><img src="./ddm-beer-festival-map.webp?v=20260828" alt="2026 동대문구 맥주축제 축제장 배치도" loading="lazy"></a><div class="map-caption"><b>추천 동선:</b> 종합안내소에서 성인인증 팔찌 → 브루&푸드 스트리트 → 비어 테라스존/돗자리존 → 메인 스테이지. 운영본부·의료부스와 화장실 위치도 미리 확인해 두면 편합니다.</div></div>`;
  const zones=doc.querySelector('#zones');
  if(zones) zones.after(map); else doc.querySelector('.wrap')?.appendChild(map);

  const packing=doc.createElement('section');
  packing.className='section';packing.id='packing';
  packing.innerHTML=`<div class="check-head"><div><h2 style="margin-bottom:2px">🎒 준비물 체크리스트</h2><p class="lead" style="margin:0">출발 전에 눌러서 체크하세요. 같은 기기에서는 체크 상태가 저장됩니다.</p></div><span class="check-progress" id="packingProgress">0 / 10 완료</span></div><div class="check-grid">
  <label class="check-item"><input type="checkbox" data-pack="id"><span><b>🪪 신분증 <em style="color:#BC4C00;font-style:normal">필수</em></b><small>주류 구매·성인인증 팔찌 발급 대비</small></span></label>
  <label class="check-item"><input type="checkbox" data-pack="pay"><span><b>💳 카드·간편결제 <em style="color:#BC4C00;font-style:normal">필수</em></b><small>맥주·푸드트럭 구매용</small></span></label>
  <label class="check-item"><input type="checkbox" data-pack="battery"><span><b>🔋 보조배터리</b><small>QR 주문·지도·사진 촬영 대비</small></span></label>
  <label class="check-item"><input type="checkbox" data-pack="mat"><span><b>🧺 가벼운 돗자리</b><small>자율 돗자리존에서 쉬기 좋음</small></span></label>
  <label class="check-item"><input type="checkbox" data-pack="water"><span><b>💧 물</b><small>8월 야외 행사 수분 보충용</small></span></label>
  <label class="check-item"><input type="checkbox" data-pack="tissue"><span><b>🧻 물티슈·휴지</b><small>푸드트럭 음식 먹을 때 유용</small></span></label>
  <label class="check-item"><input type="checkbox" data-pack="bug"><span><b>🦟 벌레기피제</b><small>중랑천 수변 야외 행사 대비</small></span></label>
  <label class="check-item"><input type="checkbox" data-pack="fan"><span><b>🌀 휴대용 선풍기</b><small>더위에 약하면 추천</small></span></label>
  <label class="check-item"><input type="checkbox" data-pack="rain"><span><b>☂️ 접이식 우산·얇은 우비</b><small>출발 직전 일기예보 보고 선택</small></span></label>
  <label class="check-item"><input type="checkbox" data-pack="outer"><span><b>🧥 얇은 겉옷</b><small>늦은 시간 수변 바람 대비</small></span></label>
  </div><div class="mini-pack"><b>🎯 가볍게 간다면:</b> 신분증 + 휴대폰/결제수단 + 보조배터리 + 물 + 작은 돗자리 정도가 핵심입니다. 음주 예정이면 차량보다 대중교통 귀가 동선을 먼저 잡아두는 편이 좋습니다.</div><div class="ref-note">준비물은 제공해주신 <a href="https://blog.naver.com/chayk3/224387859242" target="_blank" rel="noopener">네이버 블로그 참고 링크</a>와 2026 축제 공개 안내를 함께 확인해 정리했습니다. 현장 반입·운영 기준은 당일 안내가 우선입니다. <button class="reset-pack" id="resetPacking" type="button">체크 초기화</button></div>`;
  const tips=doc.querySelector('#tips2026');
  if(tips) tips.before(packing); else doc.querySelector('.wrap')?.appendChild(packing);

  const source=doc.querySelector('.source');
  if(source){
   source.innerHTML=source.innerHTML.replace('2026-08-21','2026-08-28');
   source.insertAdjacentHTML('beforeend','<br><br>· 사용자 제공 참고 블로그 (준비물 참고)<br><a href="https://blog.naver.com/chayk3/224387859242" target="_blank" rel="noopener">네이버 블로그 참고 링크</a>');
  }

  document.documentElement.innerHTML=doc.documentElement.innerHTML;

  const key='ddm-beer-2026-packing';
  const boxes=[...document.querySelectorAll('[data-pack]')];
  const progress=document.getElementById('packingProgress');
  const render=()=>{const done=boxes.filter(b=>b.checked).length;if(progress) progress.textContent=`${done} / ${boxes.length} 완료`;};
  const save=()=>{const state={};boxes.forEach(b=>{state[b.dataset.pack]=b.checked;b.closest('.check-item')?.classList.toggle('checked',b.checked)});localStorage.setItem(key,JSON.stringify(state));render();};
  let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){}
  boxes.forEach(b=>{b.checked=!!saved[b.dataset.pack];b.closest('.check-item')?.classList.toggle('checked',b.checked);b.addEventListener('change',save)});
  document.getElementById('resetPacking')?.addEventListener('click',()=>{boxes.forEach(b=>b.checked=false);save()});
  render();
 }catch(e){
  console.error(e);
  document.body.innerHTML='<div class="loading">가이드를 불러오지 못했습니다.<small>잠시 후 새로고침해 주세요.</small></div>';
 }
})();
</script>
</body>
</html>
