name: Restore Holdem V10 and Calculator

on:
  push:
    paths:
      - '.github/workflows/restore-holdem-v10.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore latest Holdem UI and add calculator only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p holdem/backups
          cp holdem/index.html holdem/backups/index-broken-before-v10-restore-2026-09-10.html
          cat .holdem_tmp/fixed0.b64 .holdem_tmp/fixed1.b64 .holdem_tmp/fixed2.b64 .holdem_tmp/fixed3.b64 > /tmp/holdem-fixed.b64
          base64 -d /tmp/holdem-fixed.b64 | gzip -dc > holdem/index.html
          echo '58bf895ab67d1be7fa1573e9f40504650aa24cde53bb50c5cebe048c075e189b  holdem/index.html' | sha256sum -c -
          grep -q 'id="rankGrid"' holdem/index.html
          grep -q 'id="suitGrid"' holdem/index.html
          grep -q 'id="oppASlots"' holdem/index.html
          grep -q 'id="oppBSlots"' holdem/index.html
          grep -q 'id="oppCSlots"' holdem/index.html
          grep -q 'alt="포커 족보 순위"' holdem/index.html
          grep -q 'poker_hand_rank_chart_v13_small.webp' holdem/index.html
          grep -q 'id="potCalcModal"' holdem/index.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('holdem/index.html').read_text(encoding='utf-8')
          a=s.index('<script>')+len('<script>')
          b=s.index('</script>',a)
          Path('/tmp/holdem.js').write_text(s[a:b],encoding='utf-8')
          PY
          node --check /tmp/holdem.js
          rm -rf .holdem_tmp
          git config user.name 'ChatGPT Update Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add holdem/index.html holdem/backups/index-broken-before-v10-restore-2026-09-10.html .holdem_tmp
          git commit -m 'Restore latest Holdem UI and add working all-in calculator'
          git push
